# ====================================================================
# SITE METADATA
# Used for headers, SEO, and social sharing
# ====================================================================
title: Andnet DeBoer | Robotics Portfolio
email: andnet.deboer@northwestern.edu
description: "Master's Robotics Portfolio: GPU-Accelerated Autonomy and Safety-Critical Systems."
author: Andnet DeBoer
baseurl: "" # The subpath of your site (e.g., /blog). Leave blank if hosted at username.github.io
url: "https://andnetdeboer.github.io" # Base hostname & protocol
github_username: andnetdeboer # Used for links/branding
repository: andnetdeboer/your-repo-name # Replace with your GitHub repo name

# ====================================================================
# BUILD SETTINGS
# Defines how Jekyll should process files
# ====================================================================
markdown: kramdown
permalink: pretty
minima:
  date_format: "%b %-d, %Y"

# Exclude unneeded files from the final build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

# ====================================================================
# CUSTOM COLLECTIONS (CRUCIAL FOR YOUR PORTFOLIO)
# This turns your _projects/ directory into navigable web pages
# ====================================================================
collections:
  projects:
    output: true # Tells Jekyll to generate HTML pages for projects
    permalink: /projects/:name/ # Custom URL structure: /projects/gpu-safety/

# ====================================================================
# PLUGINS
# Standard plugins for GitHub Pages functionality
# ====================================================================
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme # Include if you use a remote theme, otherwise remove
  - jekyll-sitemap
