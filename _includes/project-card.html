<div class="project-card">
  <a href="{{ project.url }}" class="card-link">
    <div class="card-content">
      <h3 class="card-title">{{ project.title }}</h3>
              <div class="project-overview">
                   {{ content }}
            </div>
            <div class="card-tags">
              {% for tag in project.tags %}
          <span class="tag">{{ tag }}</span>
        {% endfor %}
      </div>
    </div>

    <div class="card-image-container">
      {% if project.preview_gif contains '.mp4' or project.preview_gif contains '.webm' %}
        <video autoplay loop muted playsinline class="card-gif">
          <source src="{{ project.preview_gif }}" type="video/mp4">
        </video>
      {% else %}
        <img src="{{ project.preview_gif }}" alt="{{ project.title }}" class="card-gif">
      {% endif %}
      <div class="card-overlay">
        <span class="view-project-text">View Project</span>
      </div>
    </div>
  </a>
</div>
